name: ci

on:
  push:
  pull_request:

# actions are pinned to commit SHAs of releases at least 14 days old (see bunfig.toml for npm)
jobs:
  check:
    runs-on: ubuntu-latest
    # a hung apt mirror during the browser install would otherwise hold the runner for 6 hours
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bunx playwright install --with-deps chromium-headless-shell
        timeout-minutes: 10
      - name: smoke test, three.js from CDN
        run: bun run build:cdn && bun run test:e2e
      - name: smoke test, three.js bundled (the default)
        run: bun run build && bun run test:e2e
      - name: visual regression
        run: bun run test:visual
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-diffs
          path: tests/visual/__output__/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
